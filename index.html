<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a18" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DAFE Charts" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>DAFE Charts Mobile</title>
  <style>
    /* Cinzel (SIL OFL 1.1), bundled locally so the boot splash never
       waits on a network font. */
    @font-face {
      font-family: 'Cinzel';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/cinzel-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Cinzel';
      font-style: normal; font-weight: 900; font-display: swap;
      src: url('fonts/cinzel-latin-900-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Roboto Condensed';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/roboto-condensed-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Roboto Condensed';
      font-style: normal; font-weight: 700; font-display: swap;
      src: url('fonts/roboto-condensed-latin-700-normal.woff2') format('woff2');
    }

    /* The boot splash is the first thing the WebView paints, between the
       native Android splash and the launch sequence. It uses the same
       night field and the same gold wordmark as both, so the handover
       from one to the next is invisible. */
    #boot-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(170deg, #070c18 0%, #05070f 55%, #04060c 100%);
      color: rgba(255,255,255,0.85); font-family: sans-serif; z-index: 99998;
    }
    #boot-splash .logo {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 34px; font-weight: 900; letter-spacing: 6px;
      background: linear-gradient(180deg, #fbe6ab 0%, #e8c368 38%, #c0912f 62%, #7a5416 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 10px;
    }
    #boot-splash .sub {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 9px; letter-spacing: 5px; color: rgba(255, 232, 186, 0.42);
    }
    #boot-splash .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #c0912f; margin-top: 28px; animation: bootpulse 1s infinite alternate;
    }
    @keyframes bootpulse { from { opacity: 0.25; transform: scale(0.8); } to { opacity: 1; transform: scale(1.15); } }
    #crash-overlay { position: fixed; inset: 0; background: #0a0a18; color: #ff4477; font-family: monospace; font-size: 11px; padding: 20px; white-space: pre-wrap; word-break: break-word; overflow-y: auto; z-index: 99999; display: none; }
    #crash-overlay h3 { color: #ffb800; margin-bottom: 10px; }
  </style>
  <script>
    // Service-worker purge — a stale SW from an early build cache-first-serves
    // its old index.html forever (black screen across APK updates). Unregister
    // every SW and delete every cache. This runs BEFORE the bundle and is
    // fire-and-forget; the body-end script below handles the one-time reload
    // after the DOM is actually available to inspect.
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            for (var i = 0; i < rs.length; i++) rs[i].unregister();
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          }).catch(function () {});
        }
      } catch (e) { /* never block boot on cleanup */ }
    })();

    // Crash overlay — installed BEFORE any module loads so a boot failure
    // paints its stack on screen instead of an undebuggable black void.
    (function () {
      var shown = false;
      function paint(title, msg) {
        if (shown) return;
        shown = true;
        try {
          var splash = document.getElementById('boot-splash');
          if (splash) splash.remove();
          var ov = document.getElementById('crash-overlay');
          ov.style.display = 'block';
          ov.innerHTML = '<h3>' + title + '</h3><div id="crash-msg"></div>';
          document.getElementById('crash-msg').textContent = String(msg).slice(0, 4000);
        } catch (e) { /* last resort: nothing else to do */ }
      }
      window.addEventListener('error', function (ev) {
        paint('Startup error', (ev.message || 'Unknown error') + '\n' + (ev.filename || '') + ':' + (ev.lineno || '') + '\n\n' + (ev.error && ev.error.stack ? ev.error.stack : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        paint('Unhandled promise rejection', (r && r.stack) ? r.stack : String(r));
      });
    })();
  </script>
  <script type="module" crossorigin src="./assets/main-C6BrLdvL.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-Cz8HojjL.css">
</head>
<body>
  <div id="app"></div>
  <div id="boot-splash"><div class="logo">DAFE</div><div class="sub">TRADING SYSTEMS</div><div class="dot"></div></div>
  <div id="crash-overlay"></div>
  <script>
    // If this document was served by a stale controlling SW, it just got
    // unregistered above — reload exactly once into the clean document. Runs
    // here (body is parsed) so getElementById is meaningful, unlike the head.
    (function () {
      try {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller && !sessionStorage.getItem('dafe_sw_purge_v4')) {
          sessionStorage.setItem('dafe_sw_purge_v4', '1');
          setTimeout(function () { location.reload(); }, 250);
        }
      } catch (e) {}
      // Watchdog: if JS never removes the splash, turn its label red so you
      // can tell me "splash stuck" vs pure black.
      setTimeout(function () {
        var splash = document.getElementById('boot-splash');
        if (splash && splash.parentNode) {
          var sub = splash.querySelector('.sub');
          if (sub) { sub.textContent = 'ENGINE DID NOT START — screenshot this'; sub.style.color = '#ff4477'; }
        }
      }, 6000);
    })();
  </script>
</body>
</html>
